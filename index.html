<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apricode Games</title>
<meta name="theme-color" content="#ff9d7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apricode Games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#5b2414;background:linear-gradient(#ffe6d6 0,#ffc9aa 55%,#ffa987 100%) fixed;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:22px 18px 30px}
header{display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:18px;box-shadow:0 8px 20px rgba(190,80,40,.35)}
h1{margin:0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-1px;color:#7a2a14}
header p{margin:4px 0 0;font-weight:800;letter-spacing:6px;font-size:13px;color:#c2583a}
.lead{margin:26px 4px 14px;font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gc{display:flex;flex-direction:column;gap:3px;padding:10px 10px 14px;border-radius:26px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 28px rgba(160,70,30,.22);color:inherit;text-decoration:none;transition:transform .12s}
a.gc:active{transform:scale(.96)}
.art{height:118px;border-radius:18px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden}
.em{font-size:58px;line-height:1}
.gc b{font-size:18px;font-weight:900;padding:0 4px}
.gc small{font-size:13px;font-weight:600;color:#9a5a42;padding:0 4px}
.gc.soon{opacity:.7;background:rgba(255,255,255,.4);border:2px dashed rgba(255,255,255,.9);box-shadow:none}
.gc.soon .art{background:rgba(255,255,255,.35)}
#inst{display:none;width:100%;margin-top:22px;font:inherit;font-weight:800;font-size:18px;padding:15px;border:0;border-radius:20px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff8a5c,#ff4d7d);box-shadow:0 8px 22px rgba(255,77,125,.4)}
#insthint{display:none;margin:18px 0 0;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-weight:600;font-size:14px;text-align:center}
footer{margin-top:28px;text-align:center;font-size:13px;font-weight:700;color:#a8583a}
</style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1021790653001410"
     crossorigin="anonymous"></script>
</head>
<body>
<main>
  <header>
    <img class="logo" src="icon-192.png" alt="Apricode">
    <div><h1>Apricode</h1><p>GAMES</p></div>
  </header>
  <p class="lead">Pick a game to play</p>
  <section class="grid">
    <a class="gc" href="flappy.html">
      <span class="art" style="background:linear-gradient(#bfe9f5,#eaf8fc)"><span class="em">🎈</span></span>
      <b>Flappy Fly</b><small>Keep the balloon on the wire</small>
    </a>
    <a class="gc" href="connect4.html">
      <span class="art" style="background:linear-gradient(#b867d6,#4a54c4)">
        <svg width="104" height="88" viewBox="0 0 104 88"><rect x="2" y="2" width="100" height="84" rx="16" fill="#0aa5f5"/>
        <g fill="#43507f"><circle cx="22" cy="22" r="10"/><circle cx="52" cy="22" r="10"/><circle cx="82" cy="22" r="10"/><circle cx="22" cy="44" r="10"/><circle cx="82" cy="44" r="10"/></g>
        <circle cx="52" cy="44" r="10" fill="#ffc21a"/><circle cx="22" cy="66" r="10" fill="#ff3b30"/><circle cx="52" cy="66" r="10" fill="#ff3b30"/><circle cx="82" cy="66" r="10" fill="#ffc21a"/></svg>
      </span>
      <b>Four in a Row</b><small>vs Robot or 2 players</small>
    </a>
    <a class="gc" href="MergeFruits/">
      <span class="art" style="background:linear-gradient(#ffd9e2,#ffb3c6)"><span class="em">🍉</span></span>
      <b>Merge Fruits</b><small>Merge the fruits</small>
    </a>
    <div class="gc soon">
      <span class="art"><span class="em">✨</span></span>
      <b>More coming</b><small>Stay tuned</small>
    </div>
  </section>
  <button id="inst">📲 Install app</button>
  <p id="insthint">To install: tap Share, then Add to Home Screen.</p>
  <footer>© Apricode</footer>
</main>
<script src="pwa.js"></script>
</body>
</html>
