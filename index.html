.chip{background:var(--glass);border:1px solid var(--bd);border-radius:30px;padding:8px 18px;font-weight:700;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

<script>
(function(){

/* ---------- characters ---------- */
function drawChar(c,id,w,vy,dead){

    E(-3.5,-2,3.2,'#fff');E(3.5,-2,3.2,'#fff');
  }else if(id==='mosq'){

    O(-10,3,10,4.5,'#7a7f8a',.35);L('#eef0f5',1.5,[[-14,-1,-13,7],[-9,0,-8,8],[-4,1,-3,8]]);

    L('#2b2d33',1.5,[[13,0,26,7]]);L('#2b2d33',1,[[10,-5,12,-12],[12,-4,16,-11]]);E(11,-2,2.4,'#fff');

    WG('rgba(255,255,255,.75)',5,11,-7);
    c.save();c.beginPath();c.ellipse(0,0,13,10,0,0,TAU);c.clip();c.fillStyle='#ffcf33';c.fillRect(-14,-11,28,22);c.fillStyle='#2b2118';c.fillRect(-8,-11,4,22);c.fillRect(0,-11,4,22);c.restore();
    c.strokeStyle='#2b2118';c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,13,10,0,0,TAU);c.stroke();
    c.fillStyle='#2b2118';c.beginPath();c.moveTo(-12,-2);c.lineTo(-19,0);c.lineTo(-12,2);c.fill();
    O(11,-2,6,6,'#2b2118');L('#2b2118',1.3,[[10,-7,8,-13],[13,-6,16,-12]]);E(12,-3,2.6,'#fff');
  }else if(id==='lady'){
    WG('rgba(255,255,255,.7)',4,9,-6);
    L('#222',1.5,[[-5,9,-7,15],[0,10,0,16],[5,9,7,15]]);
    O(11,-1,6,6,'#222');O(0,0,12,11.5,'#e63946');L('#222',1.4,[[0,-11,0,11]]);
    c.fillStyle='#222';for(const p of[[-6,-4],[-6,5],[5,-5],[5,5]]){c.beginPath();c.arc(p[0],p[1],2.3,0,TAU);c.fill()}

  }else if(id==='butt'){
    for(const s of[-1,1]){c.save();c.translate(0,-2);c.rotate(s*(.35+Math.abs(w)*.5));c.fillStyle='#ff9a3c';c.strokeStyle='#7a3b00';c.lineWidth=1.3;

function wireLine(c,x0,x1,yf,sc){
  c.lineJoin='round';c.strokeStyle='#27333f';c.lineWidth=2.4;c.beginPath();

/* ---------- state ---------- */
let state='menu',time=0,t=0,score=0,deadT=0,shake=0,bgX=0,popped=false,newBest=false,hold=false,lastVy=0,wireScroll=0,devMax=0;
const fly={x:0,y:0,vy:0,wing:0,flapT:0,rot:0},bal={x:0,y:0,sway:0,sv:0};
let parts=[],pops=[],clouds=[],nodes=[];
const skies=[[[208,238,245],[188,229,240]],[[255,140,130],[255,226,160]],[[100,90,200],[255,170,205]]];
let skyCur=JSON.parse(JSON.stringify(skies[0]));
function resize(){
  const ch=wrap.clientHeight,cw=Math.min(wrap.clientWidth,ch*0.66);
  stage.style.width=cw+'px';dpr=Math.min(window.devicePixelRatio||1,2);scale=ch/H;W=cw/scale;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  if(state==='menu'||state==='ready')fly.x=W*0.3;
  if(!clouds.length)for(let i=0;i<6;i++)clouds.push({x:Math.random()*500,y:30+Math.random()*240,s:.6+Math.random()*.8,v:6+Math.random()*10});
}
window.addEventListener('resize',resize);
function initNodes(){const hy=fly.y+OFF,o=[0,0,-18,14,-22,10,-12,8],a=[];for(let i=0;i<o.length;i++)a.push({x:-140+i*140,y:hy+o[i],s:i>=3});return a}
function reset(){
  fly.x=W*0.3;fly.y=H*.42;fly.vy=0;fly.rot=0;fly.flapT=0;lastVy=0;bal.sway=bal.sv=0;bal.x=fly.x-3;bal.y=fly.y+OFF;
  parts=[];pops=[];score=0;t=0;popped=false;newBest=false;shake=0;deadT=0;wireScroll=0;devMax=0;hold=false;nodes=initNodes();
}
const speedNow=()=>120+Math.min(score*3.5,100);
const holeTol=()=>(56-Math.min(score*.3,10))*dk;
function fillNodes(){let l=nodes[nodes.length-1];const dm=50+Math.min(score*3.5,80);
  while(l.x<W+220){const d=dm*(.4+.6*Math.random())*(Math.random()<.5?-1:1);let y=l.y+d;if(y<190||y>groundY-130)y=l.y-d;y=Math.max(190,Math.min(groundY-130,y));l={x:l.x+140,y,s:true};nodes.push(l)}}
function wireBase(x){for(let i=0;i<nodes.length-1;i++){const a=nodes[i],b=nodes[i+1];if(x<b.x){const q=Math.max(0,(x-a.x)/(b.x-a.x));return a.y+(b.y-a.y)*(1-Math.cos(Math.PI*q))/2}}return nodes[nodes.length-1].y}
function wireY(x){return wireBase(x)+Math.sin((x+wireScroll)*.045)*7}
function burst(x,y,n,cols,sp,type){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=(.3+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:.5+Math.random()*.6,size:3+Math.random()*5,c:cols[i%cols.length],type:type||'spark',rot:Math.random()*6})}}
function popup(txt,x,y,c){pops.push({txt,x,y,life:0,c})}

/* ---------- input ---------- */
function press(){
  audio();
  if(state==='ready')state='play';
  if(state!=='play')return;
  hold=true;fly.vy=Math.min(fly.vy,-170);fly.flapT=.25;sfx.flap();burst(fly.x-4,fly.y+12,3,['#ffffff'],40,'puff');
}
function release(){hold=false}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,#ad'))return;if(state==='ready'||state==='play'){e.preventDefault();press()}});
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);window.addEventListener('blur',release);
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)press()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')release()});

function die(pop){
  if(state!=='play')return;
  state='dead';deadT=0;hold=false;shake=14;sfx.hit();
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  if(pop){popped=true;burst(bal.x,bal.y,28,[BC[colIdx][0],BC[colIdx][1],'#ffffff','#ffd84d'],260,'conf')}
  burst(fly.x,fly.y,12,['#ffd84d','#ffffff'],200,'spark');
  if(score>best){best=score;newBest=true;ls.s(diffIdx?'flappyfly_best_'+diffIdx:'flappyfly_best',best)}
  fly.vy=-200;
}

/* ---------- update ---------- */
function updWire(dt){
  const sp=speedNow();wireScroll+=sp*dt;
  for(const n of nodes)n.x-=sp*dt;
  while(nodes.length>2&&nodes[1].x<-10)nodes.shift();
  fillNodes();
  for(const n of nodes)if(n.s&&!n.p&&n.x<fly.x){
    n.p=1;const perfect=devMax<.4;score+=perfect?2:1;
    if(perfect){sfx.perfect();popup('Perfect! +2',W/2,H*.3,'#4cd97b')}else sfx.score();
    burst(n.x,n.y,10,['#ffd84d','#ffffff','#ff9ad5'],170,'spark');
    if(devMax>.85){sfx.near();popup('Close call!',W/2,H*.38,'#ff8a4d');shake=Math.max(shake,4)}
    devMax=0}
  const dev=Math.abs(wireY(bal.x)-bal.y),tol=holeTol()+Math.max(0,2-t)*16;
  devMax=Math.max(devMax,dev/tol);
  if(dev>tol)die(true);
}
function update(dt){
  time+=dt;
  clouds.forEach(c=>{c.x-=c.v*dt;if(c.x<-120)c.x=W+120});
  const ti=Math.floor(score/10)%3;
  for(let k=0;k<2;k++)for(let j=0;j<3;j++)skyCur[k][j]+=(skies[ti][k][j]-skyCur[k][j])*Math.min(1,dt*1.5);
  if(state==='menu'||state==='ready'){bgX+=25*dt;fly.y=H*.42+Math.sin(time*3)*8;fly.vy=Math.cos(time*3)*24;fly.rot=0;nodes=initNodes()}
  if(state==='play'){
    t+=dt;bgX+=speedNow()*dt;
    fly.vy+=(900-(hold?1800:0))*dt;fly.vy=Math.max(-300,Math.min(380,fly.vy));fly.y+=fly.vy*dt;
    fly.rot=Math.max(-.3,Math.min(.5,fly.vy/900));
    updWire(dt);
    if(state==='play'){if(bal.y+BR>groundY)die(true);else if(fly.y-FR<ceilY)die(false)}
  }
  if(state==='dead'){
    deadT+=dt;fly.vy=Math.min(fly.vy+1500*dt,720);fly.y+=fly.vy*dt;
    if(fly.y>groundY-FR){fly.y=groundY-FR;fly.vy=0}else fly.rot+=dt*6;
    if(!popped)bal.y-=120*dt;
    if(deadT>.95)showOver();
  }
  if(state!=='dead'){
    const ay=Math.max(-3000,Math.min(3000,(fly.vy-lastVy)/Math.max(dt,.001)));lastVy=fly.vy;
    bal.sv+=(-bal.sway*140-bal.sv*9-ay*.012)*dt;bal.sway=Math.max(-8,Math.min(8,bal.sway+bal.sv*dt));
    bal.x=fly.x-3+Math.sin(time*2.2)*1.5;bal.y=fly.y+OFF+bal.sway;
  }
  for(const p of parts){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='conf')p.vy+=500*dt;p.vx*=.985;p.rot+=dt*8}
  parts=parts.filter(p=>p.life<p.max);
  for(const p of pops){p.life+=dt;p.y-=40*dt}
  pops=pops.filter(p=>p.life<1);
  fly.flapT=Math.max(0,fly.flapT-dt);
  fly.wing+=dt*((hold||fly.flapT>0)?70:(state==='dead'?8:30));
  shake=Math.max(0,shake-dt*30);
}

/* ---------- drawing ---------- */
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function pile(sp,y,cols,r,seed){const step=r*1.5,sh=bgX*sp,base=Math.floor(sh/step),fr=sh-base*step;
  for(let n=-2;n<W/step+3;n++){const m=n+base,rr=r*(1+.15*Math.sin(m*1.7+seed)),cx=n*step-fr,col=cols[((m%cols.length)+cols.length)%cols.length],yy=y+Math.sin(m*2.3+seed)*5;
    ctx.fillStyle=col;ctx.strokeStyle='rgba(70,45,60,.5)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(cx,yy,rr*1.3,rr,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(cx-rr*.4,yy-rr*.5,rr*.45,rr*.14,-.3,0,TAU);ctx.fill()}}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(skyCur[0]));g.addColorStop(1,rgb(skyCur[1]));
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(const c of clouds){ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.arc(24,-8,28,0,TAU);ctx.arc(52,0,22,0,TAU);ctx.rect(0,0,52,22);ctx.fill();ctx.restore()}
  pile(.2,groundY+24,['#f6d26b','#f9de8a','#f3c24f'],30,0);pile(.35,groundY+30,['#8fb0b2','#f6d26b','#f07a55'],28,1);
}
function drawWire(){
  wireLine(ctx,-6,W+6,wireY,wireScroll);
  ctx.fillStyle='#e8445a';
  for(const n of nodes)if(n.s&&n.x>-10&&n.x<W+10){const y=wireY(n.x);ctx.beginPath();for(let i=0;i<16;i++){const r=i%2?2.5:7,a=i*.3927;ctx.lineTo(n.x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.fill()}
}
function drawEdges(){
  pile(.6,groundY+42,['#f07a55','#ec8d6e','#f6d26b','#8fb0b2'],30,2);
  wireLine(ctx,-8,W+8,x=>9+Math.sin((x+bgX)*.045)*3,bgX);
}
function drawBalloon(){
  if(popped)return;
  ctx.save();ctx.translate(bal.x,bal.y);ctx.rotate(bal.sway*.012+Math.sin(time*2)*.02);drawRing(ctx,colIdx);ctx.restore();
  wireLine(ctx,bal.x-44*dk,bal.x-4,wireY,wireScroll);
}
function drawFly(){
  ctx.save();ctx.translate(fly.x,fly.y);ctx.rotate(fly.rot*.5);drawChar(ctx,charId,Math.sin(fly.wing),fly.vy,state==='dead');ctx.restore();
}
function drawParts(){
  for(const p of parts){const a=1-p.life/p.max;ctx.globalAlpha=a;ctx.fillStyle=p.c;
    if(p.type==='puff'){ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+p.life*2),0,TAU);ctx.fill()}
    else if(p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-3,-2,7,4);ctx.restore()}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?p.size*.4:p.size;ctx.lineTo(Math.cos(i*.785)*r,Math.sin(i*.785)*r)}ctx.fill();ctx.restore()}}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='800 20px system-ui,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#17384a';ctx.lineJoin='round';
  for(const p of pops){ctx.globalAlpha=1-p.life;ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y)}
  ctx.globalAlpha=1;
}
function drawHUD(){
  if(state==='play'||state==='dead'||state==='ready'){
    ctx.textAlign='center';ctx.font='900 56px system-ui,sans-serif';ctx.lineWidth=7;ctx.strokeStyle='#fff';ctx.lineJoin='round';
    ctx.strokeText(score,W/2,90);ctx.fillStyle='#12a3c4';ctx.fillText(score,W/2,90);
  }
  if(state==='ready'){
    const s=1+Math.sin(time*6)*.05;ctx.save();ctx.translate(W/2,H*.78);ctx.scale(s,s);
    ctx.font='900 24px system-ui,sans-serif';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText('Tap & hold to rise!',0,0);ctx.fillStyle='#ff4d7d';ctx.fillText('Tap & hold to rise!',0,0);ctx.restore();
  }
}
function render(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();drawWire();drawEdges();drawBalloon();drawFly();drawParts();
  ctx.restore();drawHUD();
}
function drawPreview(){
  const c=pc;c.setTransform(2,0,0,2,0,0);
  const g=c.createLinearGradient(0,0,0,200);g.addColorStop(0,'#bfe9f5');g.addColorStop(1,'#eaf8fc');c.fillStyle=g;c.fillRect(0,0,240,200);
  const yf=x=>136+Math.sin((x-120)*.03+time*2)*7;
  wireLine(c,0,240,yf,time*40);
  c.save();c.translate(120,136);c.scale(.85,.85);c.rotate(Math.sin(time*2)*.03);drawRing(c,colIdx);
  c.translate(0,-OFF);drawChar(c,charId,Math.sin(time*26),Math.cos(time*3)*60,false);c.restore();
  wireLine(c,120-36*dk,116,yf,time*40);
}

/* ---------- UI ---------- */
const cg=$('chars'),sw=$('cols');
function setDiff(i){diffIdx=i;dk=DIFFS[i][1];BR=66*dk;OFF=84*dk;ls.s('ff_diff',i);best=+ls.g(i?'flappyfly_best_'+i:'flappyfly_best',0)||0;const m=$('mBest');if(m)m.textContent=best;[...$('seg').children].forEach((b,k)=>b.classList.toggle('sel',k===i))}
DIFFS.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d[0];$('seg').appendChild(b);b.addEventListener('click',()=>{audio();sfx.click();setDiff(i);reset()})});
setDiff(diffIdx);
function mark(){
  [...cg.children].forEach(b=>b.classList.toggle('sel',b.dataset.id===charId));
  [...sw.children].forEach((b,i)=>b.classList.toggle('sel',i===colIdx));
  $('pvn').textContent=CH.find(c=>c[0]===charId)[1];
}
CH.forEach(ch=>{
  const b=document.createElement('button');b.className='cc';b.dataset.id=ch[0];b.innerHTML='<canvas width="144" height="144"></canvas><span>'+ch[1]+'</span>';cg.appendChild(b);
  const c=b.firstChild.getContext('2d');c.scale(2,2);c.translate(36,38);c.scale(1.35,1.35);drawChar(c,ch[0],.3,0,false);
  b.addEventListener('click',()=>{audio();sfx.click();charId=ch[0];ls.s('ff_char',charId);mark()});
});
BC.forEach((col,i)=>{
  const b=document.createElement('button');b.className='sw';b.style.background='linear-gradient(135deg,'+col[0]+','+col[1]+')';b.setAttribute('aria-label','Balloon color '+(i+1));sw.appendChild(b);
  b.addEventListener('click',()=>{audio();sfx.click();colIdx=i;ls.s('ff_col',i);mark()});
});
mark();
function show(id){['menu','over','cust'].forEach(k=>$(k).classList.toggle('show',k===id))}
function showOver(){
  if(state==='over')return;state='over';
  $('oTitle').textContent=popped?'Pop!':'Ouch!';
  $('oScore').textContent=score;$('oBest').textContent=best;$('mBest').textContent=best;
  $('new').style.display=newBest?'inline-block':'none';show('over');
}
function startReady(){audio();sfx.click();reset();state='ready';show(null)}
function toMenu(id){audio();sfx.click();reset();state='menu';show(id)}
$('play').addEventListener('click',startReady);
$('again').addEventListener('click',startReady);
$('home').addEventListener('click',()=>toMenu('menu'));
$('custBtn').addEventListener('click',()=>{audio();sfx.click();show('cust')});
$('custBtn2').addEventListener('click',()=>toMenu('cust'));
$('done').addEventListener('click',()=>{audio();sfx.click();show('menu')});

const ads=[...document.querySelectorAll('#ad a')];let ai=0;
ads.forEach((a,i)=>{a.style.transform=i?'translateX(100%)':'none'});
if(ads.length>1)setInterval(()=>{const cur=ads[ai],nx=ads[(ai+1)%ads.length];nx.style.transition='none';nx.style.transform='translateX(100%)';void nx.offsetWidth;nx.style.transition='';cur.style.transform='translateX(-100%)';nx.style.transform='translateX(0)';ai=(ai+1)%ads.length},5000);
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  update(dt);render();if(custEl.classList.contains('show'))drawPreview();
  requestAnimationFrame(loop);
}
resize();reset();
requestAnimationFrame(loop);
})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>

(function(){var done=false;try{done=localStorage.getItem('ff_inst')==='1'}catch(x){}var dip=null,b=document.getElementById('inst'),h=document.getElementById('insthint');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dip=e;if(!done)b.style.display='block'});
b.addEventListener('click',function(){if(!dip)return;dip.prompt();dip.userChoice.then(function(r){dip=null;b.style.display='none';if(r&&r.outcome==='accepted'){try{localStorage.setItem('ff_inst','1')}catch(x){}}},function(){})});
window.addEventListener('appinstalled',function(){b.style.display='none';try{localStorage.setItem('ff_inst','1')}catch(x){}});
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
if(sa){done=true;b.style.display='none';try{localStorage.setItem('ff_inst','1')}catch(x){}}if(ios&&!sa)h.style.display='block';})();
