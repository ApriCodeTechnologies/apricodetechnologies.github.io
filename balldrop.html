<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ball Drop · ApriCode Games</title>
<meta name="theme-color" content="#ffb180">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;overflow:hidden;background:#ffa987}
#wrap{height:100vh;height:100dvh;display:flex;justify-content:center;background:linear-gradient(#ffe6d6,#ffc9aa 55%,#ffa987)}
#stage{position:relative;height:100%;box-shadow:0 0 40px rgba(58,29,18,.3)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.row{display:flex;gap:10px}.row .big{font-size:16px}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>

<div class="ov show" id="start"><div class="card">
  <h2>Ball Drop</h2>
  <p>Hold the screen to open the gate and drop the balls. Drag sideways to move the cups and catch them!</p>
  <button class="big" id="go">Play</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>

<div class="ov" id="pause"><div class="card">
  <h2>Paused</h2>
  <button class="big" id="resume">Resume</button>
  <button class="big alt" id="redo">Restart level</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>

<div class="ov" id="lvl"><div class="card">
  <h2 id="lT">Level complete!</h2><p id="lM"></p>
  <button class="big" id="next">Next level</button>
</div></div>

<div class="ov" id="over"><div class="card">
  <h2>Level failed</h2><p id="oM"></p>
  <button class="big" id="again">Try level again</button>
  <button class="big alt" id="fresh">Start over</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>

<script src="fx.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LS={g(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const W=360,R=6.5,GATE=233,TAU=Math.PI*2,INK='#3a1d12';
let H=640,scale=1,dpr=1;
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),wrap=$('wrap');
const COL={y:'#ffd23f',g:'#7ed957',b:'#38b6ff',o:'#ff8a3d',p:'#ff5db1'},VAL={y:1,g:2,b:3,o:4,p:5};

/* ---------- physics ---------- */
const G=1500,DT=1/120,SP=224;
let balls=[],reserve=[[],[]],gateOpen=false,cupOff=114,cupY=400,roofY=592,cups=[{mult:1,flash:0},{mult:1,flash:0}];
const SEG=[[7,0,7,127],[7,127,163,193],[163,193,163,GATE],[197,193,197,GATE],[197,193,353,127],[353,127,353,0],[85,0,85,95],[275,0,275,95]];
function cupX(i){const P=2*SP;return (((cupOff+i*SP)%P)+P)%P-44}
function colSeg(b,x1,y1,x2,y2,e){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2;t=t<0?0:t>1?1:t;
  const px=x1+t*dx,py=y1+t*dy;let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,rr=R+2;
  if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-6;nx/=d;ny/=d;
  let vx=b.x-b.px,vy=b.y-b.py;
  b.x+=nx*(rr-d);b.y+=ny*(rr-d);
  const vn=vx*nx+vy*ny;
  if(vn<0){vx-=(1+e)*vn*nx;vy-=(1+e)*vn*ny}
  b.px=b.x-vx;b.py=b.y-vy;
}
function step(){
  for(const b of balls){
    let vx=(b.x-b.px)*.9993,vy=(b.y-b.py)*.9993+G*DT*DT;
    const sp=Math.hypot(vx,vy);if(sp>7.5){vx*=7.5/sp;vy*=7.5/sp}
    b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy;
  }
  for(let it=0;it<3;it++){
    for(let i=0;i<balls.length;i++){
      const a=balls[i];
      for(let j=i+1;j<balls.length;j++){
        const c=balls[j],dx=c.x-a.x;if(dx>2*R||dx<-2*R)continue;
        const dy=c.y-a.y;if(dy>2*R||dy<-2*R)continue;
        const d2=dx*dx+dy*dy;if(d2>=4*R*R||d2===0)continue;
        const d=Math.sqrt(d2),p=(2*R-d)/d*.5;
        a.x-=dx*p;a.y-=dy*p;c.x+=dx*p;c.y+=dy*p;
      }
    }
    for(const b of balls){
      if(b.y<GATE+30){
        for(const s of SEG)colSeg(b,s[0],s[1],s[2],s[3],.3);
        if(!gateOpen)colSeg(b,163,GATE,197,GATE,.2);
      }
      if(b.out){
        if(b.y>cupY-14&&b.y<cupY+100)for(let i=0;i<2;i++){const cx=cupX(i);colSeg(b,cx-31,cupY,cx-20,cupY+82,.3);colSeg(b,cx+31,cupY,cx+20,cupY+82,.3)}
        if(b.y>roofY-30){colSeg(b,180,roofY,-60,roofY+60,.3);colSeg(b,180,roofY,420,roofY+60,.3)}
      }
    }
  }
  for(const b of balls)if(!b.out&&b.y>GATE+R+1)b.out=true;
}

/* ---------- game ---------- */
let state='menu',time=0,acc=0,score=0,level=1,goal=36,caught=0,combo=0,relT=0,relN=0,lvlScore=0,best=parseInt(LS.g('bd_best','0'),10)||0;
let fl=[],parts=[],shake=0;
function rndType(l){let r=Math.random();
  if(l>=9){if(r<.05)return'p';r-=.05}
  if(l>=7){if(r<.07)return'o';r-=.07}
  if(l>=5){if(r<.10)return'b';r-=.10}
  if(l>=3){if(r<.14)return'g'}
  return'y';
}
const mk=(x,y,t)=>({x,y,px:x,py:y,t,out:false,age:0});
function cupMults(l){const r=Math.random()<.5;if(l<3)return[1,1];if(l<6)return r?[2,1]:[1,2];if(l<9)return[2,2];return r?[3,2]:[2,3]}
function layout(){cupY=Math.max(396,H*.62);roofY=H-50}
function resize(){
  const ch=wrap.clientHeight,cw=Math.min(wrap.clientWidth,ch*.66);
  stage.style.width=cw+'px';dpr=Math.min(window.devicePixelRatio||1,2);scale=cw/W;H=ch/scale;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);layout();
}
window.addEventListener('resize',resize);
function startLevel(){
  balls=[];reserve=[[],[]];
  for(let s=0;s<2;s++)for(let i=0;i<30;i++)reserve[s].push(rndType(level));
  for(let i=0;i<40;i++){const x=22+Math.random()*316,sl=x<163?127+(x-7)*.423:x>197?127+(353-x)*.423:193;balls.push(mk(x,95+Math.random()*Math.max(5,sl-12-95),rndType(level)))}
  gateOpen=false;for(let i=0;i<500;i++)step();
  for(const b of balls){b.px=b.x;b.py=b.y}
  goal=Math.min(90,30+6*level);caught=0;combo=0;relT=0;fl=[];parts=[];lvlScore=score;
  const m=cupMults(level);cups=[{mult:m[0],flash:0},{mult:m[1],flash:0}];cupOff=114;
  state='ready';
}
function remaining(){let n=reserve[0].length+reserve[1].length;for(const b of balls)if(!b.out)n++;return n}
function comboMult(){return 1+Math.min(4,Math.floor(combo/10))}
function update(dt){
  time+=dt;
  for(const c of cups)c.flash=Math.max(0,c.flash-dt);
  fl.forEach(f=>{f.t+=dt;f.y-=30*dt});fl=fl.filter(f=>f.t<.9);
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});parts=parts.filter(p=>p.t<.5);
  shake=Math.max(0,shake-dt*30);
  if(state!=='play')return;
  // refill the funnel from the side tubs
  relT-=dt;
  let inF=0;for(const b of balls)if(!b.out)inF++;
  if(relT<=0&&inF<44&&reserve[0].length+reserve[1].length>0){
    relT=.05;let s=relN++%2;if(!reserve[s].length)s=1-s;
    const t=reserve[s].pop(),k=reserve[s].length;
    balls.push(mk((s?284.5:17.3)+(k%5)*14.6,7+Math.floor(k/5)*14.5,t));
  }
  acc+=dt;let n=0;while(acc>=DT&&n<6){step();acc-=DT;n++}if(acc>DT)acc=0;
  // catches and misses
  for(const b of balls){
    if(!b.out)continue;b.age+=dt;
    for(let i=0;i<2;i++){
      const cx=cupX(i),yy=b.y-cupY;
      if(yy>26&&yy<82){
        const l=cx-31+11*(yy/82),r=cx+31-11*(yy/82);
        if(b.x>l+3&&b.x<r-3&&b.y-b.py>0){catchBall(b,i,cx);break}
      }
    }
    if(!b.dead&&(b.y>H+20||b.x<-20||b.x>W+20||b.age>9)){b.dead=true;combo=0}
  }
  balls=balls.filter(b=>!b.dead);
  // level end?
  const rem=remaining(),air=balls.length-balls.filter(b=>!b.out).length;
  if(caught+rem+air<goal)finish(false);
  else if(rem===0&&air===0)finish(caught>=goal);
}
function catchBall(b,i,cx){
  b.dead=true;caught++;combo++;
  const pts=VAL[b.t]*cups[i].mult*comboMult();score+=pts;cups[i].flash=.25;
  fl.push({x:cx,y:cupY-6,t:0,txt:'+'+pts});
  for(let k=0;k<5;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*140,t:0,c:COL[b.t]});
  AP.tone(520+Math.min(combo,24)*22,.07,'sine',.09);AP.vib(8);
  if(score>best){best=score;LS.s('bd_best',best)}
}
function finish(ok){
  if(state!=='play')return;state=ok?'won':'lost';gateOpen=false;
  setTimeout(()=>{
    if(ok){
      const bonus=caught>=95?100:0;score+=bonus;if(score>best){best=score;LS.s('bd_best',best)}
      $('lT').textContent='Level '+level+' complete!';
      $('lM').textContent='Caught '+caught+' of 100'+(bonus?' · Perfect! +100':'')+' · Score '+score.toLocaleString('en-US');
      $('lvl').classList.add('show');AP.sfx.win();AP.confetti(120);AP.vib([40,30,80]);
    }else{
      $('oM').textContent='You needed '+goal+' balls but caught '+caught+'. Best score: '+best.toLocaleString('en-US');
      $('over').classList.add('show');AP.sfx.lose();
    }
  },700);
}

/* ---------- drawing ---------- */
function ball(x,y,t){
  ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fillStyle=COL[t];ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(x-2,y-2,1.9,0,TAU);ctx.fill();
}
function txt(s,x,y,size,fill,stroke,sw){
  ctx.font='900 '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(stroke){ctx.lineWidth=sw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function draw(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe6d6');g.addColorStop(1,'#ffa987');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.lineJoin='round';ctx.lineCap='round';
  // funnel
  ctx.beginPath();ctx.moveTo(7,-4);ctx.lineTo(7,127);ctx.lineTo(163,193);ctx.lineTo(163,GATE);ctx.lineTo(197,GATE);ctx.lineTo(197,193);ctx.lineTo(353,127);ctx.lineTo(353,-4);
  ctx.fillStyle='rgba(255,255,255,.62)';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=4.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(85,-4);ctx.lineTo(85,95);ctx.moveTo(275,-4);ctx.lineTo(275,95);ctx.stroke();
  if(!gateOpen){ctx.strokeStyle=INK;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(165,GATE);ctx.lineTo(195,GATE);ctx.stroke();ctx.strokeStyle='#ff5d6c';ctx.lineWidth=4;ctx.stroke()}
  // reserve balls in the tubs
  for(let s=0;s<2;s++)reserve[s].forEach((t,k)=>ball((s?284.5:17.3)+(k%5)*14.6,7+Math.floor(k/5)*14.5,t));
  for(const b of balls)ball(b.x,b.y,b.t);
  // cups
  for(let i=0;i<2;i++){
    const cx=cupX(i),m=cups[i].mult,c=m===1?'#fff3e6':m===2?'#7ed957':'#ff9d4d',f=cups[i].flash>0;
    ctx.beginPath();ctx.moveTo(cx-31,cupY);ctx.lineTo(cx+31,cupY);ctx.lineTo(cx+20,cupY+82);ctx.lineTo(cx-20,cupY+82);ctx.closePath();
    ctx.fillStyle=f?'rgba(255,255,255,.95)':c;ctx.globalAlpha=f?1:.78;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cupY+58,14,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.stroke();
    txt(m+'X',cx,cupY+64,15,INK);
  }
  // roof
  ctx.beginPath();ctx.moveTo(-60,roofY+60);ctx.lineTo(180,roofY);ctx.lineTo(420,roofY+60);ctx.lineWidth=4.5;ctx.strokeStyle=INK;ctx.stroke();
  // particles and floating text
  for(const p of parts){ctx.globalAlpha=1-p.t/.5;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,TAU);ctx.fill()}
  ctx.globalAlpha=1;
  for(const f of fl){ctx.globalAlpha=1-f.t/.9;txt(f.txt,f.x,f.y,17,'#fff',INK,4)}
  ctx.globalAlpha=1;ctx.restore();
  // HUD: combo, remaining, score
  const cm=comboMult();
  ctx.beginPath();ctx.arc(180,-2,26,0,Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
  txt('X'+cm,180,17,15,INK);
  ctx.beginPath();ctx.roundRect?ctx.roundRect(120,28,120,16,8):ctx.rect(120,28,120,16);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
  const fr=cm>=5?1:(combo%10)/10;
  if(fr>0){ctx.beginPath();ctx.roundRect?ctx.roundRect(122,30,116*fr,12,6):ctx.rect(122,30,116*fr,12);ctx.fillStyle='#ff9d4d';ctx.fill()}
  ctx.beginPath();ctx.moveTo(119,76);ctx.lineTo(180,54);ctx.lineTo(241,76);ctx.lineWidth=3.5;ctx.stroke();
  txt(String(remaining()),180,78,22,INK);
  txt(score.toLocaleString('en-US'),180,304,54,INK,'#fff',9);
  txt('Level '+level,180,336,20,INK,'#fff',5);
  txt('Goal '+goal+' · Caught '+caught,180,358,14,caught>=goal?'#1f8f4a':INK,'#fff',4);
  // buttons
  for(const bt of [[33,185,0],[327,185,1]]){
    ctx.beginPath();ctx.arc(bt[0],bt[1],20,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
    if(bt[2]===0){ctx.fillStyle=INK;ctx.fillRect(26,177,5,16);ctx.fillRect(36,177,5,16)}else txt(AP.muted()?'🔇':'🔊',bt[0],bt[1]+6,17,INK);
  }
  if(state==='ready'){
    txt('Hold to drop the balls',180,H*.74,22,INK,'#fff',6);
    txt('Drag to move the cups',180,H*.74+28,18,INK,'#fff',5);
    ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('👆',180+Math.sin(time*3)*60,H*.86);
  }
}

/* ---------- input ---------- */
let down=false,lastX=0;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=pos(e);
  if(Math.hypot(p.x-33,p.y-185)<28){if(state==='play'||state==='ready')pause();return}
  if(Math.hypot(p.x-327,p.y-185)<28){AP.setMuted(!AP.muted());return}
  if(state==='ready')state='play';
  if(state!=='play')return;
  down=true;gateOpen=true;lastX=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(x){}
});
cv.addEventListener('pointermove',e=>{if(!down)return;cupOff+=(e.clientX-lastX)/scale;lastX=e.clientX});
const up=()=>{down=false;gateOpen=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft')cupOff-=14;else if(e.code==='ArrowRight')cupOff+=14;
  else if(e.code==='Space'){e.preventDefault();if(state==='ready')state='play';if(state==='play')gateOpen=true}
});
window.addEventListener('keyup',e=>{if(e.code==='Space')gateOpen=false});
function pause(){if(state!=='play'&&state!=='ready')return;gateOpen=false;down=false;$('pause').dataset.prev=state;state='paused';$('pause').classList.add('show')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- buttons ---------- */
function hideAll(){['start','pause','lvl','over'].forEach(i=>$(i).classList.remove('show'))}
function newGame(){score=0;level=1;hideAll();startLevel()}
$('go').addEventListener('click',newGame);
$('resume').addEventListener('click',()=>{$('pause').classList.remove('show');state=$('pause').dataset.prev||'play'});
$('redo').addEventListener('click',()=>{score=lvlScore;hideAll();startLevel()});
$('next').addEventListener('click',()=>{level++;hideAll();startLevel()});
$('again').addEventListener('click',()=>{score=lvlScore;hideAll();startLevel()});
$('fresh').addEventListener('click',newGame);

let last=performance.now();
function loop(t){const dt=Math.min((t-last)/1000,1/20);last=t;update(dt);draw();requestAnimationFrame(loop)}
resize();layout();startLevel();state='menu';AP.autoTap();
requestAnimationFrame(loop);
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
