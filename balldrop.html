<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ball Drop · ApriCode Games</title>
<meta name="theme-color" content="#ffb27f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;overflow:hidden;background:#ffa987}
#wrap{height:100vh;height:100dvh;display:flex;justify-content:center;background:linear-gradient(#ffe6d6,#ffc9aa 55%,#ffa987)}
#stage{position:relative;height:100%;box-shadow:0 0 40px rgba(58,29,18,.3)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.pw{display:flex;gap:8px;justify-content:center;font-weight:800;font-size:14px;text-align:left}
.pw span{background:#fff3e6;border:2px solid var(--ink);border-radius:12px;padding:6px 8px;flex:1}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas></div></div>

<div class="ov show" id="start"><div class="card">
  <h2>Ball Drop</h2>
  <p>Tap at the right moment to release the balls into the cups. A ball that lands in a cup comes back from the top. A ball that misses is lost. Try not to lose all 100 balls and beat your record!</p>
    <button class="big" id="go">Play</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>

<div class="ov" id="pause"><div class="card">
  <h2>Paused</h2>
  <button class="big" id="resume">Resume</button>
  <button class="big alt" id="redo">Restart game</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>


<div class="ov" id="over"><div class="card">
  <h2 id="oT">Out of balls!</h2><p id="oM"></p>
  <button class="big" id="again">Play again</button>
  <a class="lnk" href="./">← ApriCode Games</a>
</div></div>

<script src="fx.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const LS={g(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const W=360,R=6.5,GATE=233,TAU=Math.PI*2,INK='#3a1d12';
let H=640,scale=1,dpr=1;
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),wrap=$('wrap');
const COL={y:'#ffd23f',g:'#7ed957',b:'#38b6ff',o:'#ff8a3d',p:'#ff5db1',s:'#ffe14d',m:'#ff6b6b',f:'#8fdcff'};
const VAL={y:1,g:2,b:3,o:4,p:5,s:10,m:3,f:3},GLY={s:'⭐',m:'🧲',f:'❄️'};
const CUPCOL=['#ff9d7a','#9b87ff','#4fd1c5'];

/* ---------- physics ---------- */
const G=1500,DT=1/120;
let balls=[],reserve=[[],[]],gateOpen=false,cupOff=114,cupY=400,roofY=592,SPc=224,Pc=448;
let cups=[{mult:1,need:15,left:15,done:false,flash:0},{mult:1,need:15,left:15,done:false,flash:0}];
const SEG=[[7,0,7,127],[7,127,163,193],[163,193,163,GATE],[197,193,197,GATE],[197,193,353,127],[353,127,353,0],[85,0,85,95],[275,0,275,95]];
function cupX(i){return (((cupOff+i*SPc)%Pc)+Pc)%Pc-44}
function colSeg(b,x1,y1,x2,y2,e){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=((b.x-x1)*dx+(b.y-y1)*dy)/l2;t=t<0?0:t>1?1:t;
  const px=x1+t*dx,py=y1+t*dy;let nx=b.x-px,ny=b.y-py;const d2=nx*nx+ny*ny,rr=R+2;
  if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-6;nx/=d;ny/=d;
  let vx=b.x-b.px,vy=b.y-b.py;
  b.x+=nx*(rr-d);b.y+=ny*(rr-d);
  const vn=vx*nx+vy*ny;
  if(vn<0){vx-=(1+e)*vn*nx;vy-=(1+e)*vn*ny}
  b.px=b.x-vx;b.py=b.y-vy;
}
function step(){
  for(const b of balls){
    let vx=(b.x-b.px)*.9993,vy=(b.y-b.py)*.9993+G*DT*DT;
    const sp=Math.hypot(vx,vy);if(sp>7.5){vx*=7.5/sp;vy*=7.5/sp}
    b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy;
  }
  for(let it=0;it<3;it++){
    for(let i=0;i<balls.length;i++){
      const a=balls[i];
      for(let j=i+1;j<balls.length;j++){
        const c=balls[j],dx=c.x-a.x;if(dx>2*R||dx<-2*R)continue;
        const dy=c.y-a.y;if(dy>2*R||dy<-2*R)continue;
        const d2=dx*dx+dy*dy;if(d2>=4*R*R||d2===0)continue;
        const d=Math.sqrt(d2),p=(2*R-d)/d*.5;
        a.x-=dx*p;a.y-=dy*p;c.x+=dx*p;c.y+=dy*p;
      }
    }
    for(const b of balls){
      if(b.y<GATE+30){
        for(const s of SEG)colSeg(b,s[0],s[1],s[2],s[3],.3);
        if(!gateOpen)colSeg(b,163,GATE,197,GATE,.2);
      }
      if(b.out){
        if(b.y>cupY-14&&b.y<cupY+100)for(let i=0;i<cups.length;i++){const cx=cupX(i);colSeg(b,cx-31,cupY,cx-20,cupY+82,.12);colSeg(b,cx+31,cupY,cx+20,cupY+82,.12)}
        if(b.y>roofY-30){colSeg(b,180,roofY,-60,roofY+60,.3);colSeg(b,180,roofY,420,roofY+60,.3)}
      }
    }
  }
  for(const b of balls)if(!b.out&&b.y>GATE+R+1)b.out=true;
}

/* ---------- game ---------- */
let state='menu',time=0,acc=0,score=0,level=1,caught=0,combo=0,relT=0,relN=0,lost=0,recordBefore=0,best=parseInt(LS.g('bd_best','0'),10)||0;
let fl=[],parts=[],rets=[],shake=0,magnetT=0,freezeT=0;
function rndType(l){const r=Math.random();if(l>=7&&r<.06)return'p';if(l>=5&&r<.12)return'b';if(l>=3&&r<.2)return'g';if(l>=2&&r<.28)return'o';return'y'}
const mk=(x,y,t)=>({x,y,px:x,py:y,t,out:false,age:0});
function layout(){cupY=Math.max(396,H*.62);roofY=H-50}
function resize(){
  const ch=wrap.clientHeight,cw=Math.min(wrap.clientWidth,ch*.66);
  stage.style.width=cw+'px';dpr=Math.min(window.devicePixelRatio||1,2);scale=cw/W;H=ch/scale;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);layout();
}
window.addEventListener('resize',resize);
function setMults(){
  const n=cups.length,ri=(Math.random()*n)|0,m=new Array(n).fill(1);
  if(level>=3)m[ri]=2;if(level>=6)m.fill(2);if(level>=9)m[ri]=3;
  cups.forEach((c,i)=>{c.mult=m[i]});
}
function startGame(){
  balls=[];reserve=[[],[]];rets=[];
  for(let s=0;s<2;s++)for(let i=0;i<30;i++)reserve[s].push('y');
  for(let i=0;i<40;i++){const x=22+Math.random()*316,sl=x<163?127+(x-7)*.423:x>197?127+(353-x)*.423:193;balls.push(mk(x,95+Math.random()*Math.max(5,sl-12-95),'y'))}
  cups=[{mult:1,count:0,flash:0},{mult:1,count:0,flash:0}];SPc=224;Pc=448;cupOff=114;
  gateOpen=false;for(let i=0;i<500;i++)step();
  for(const b of balls){b.px=b.x;b.py=b.y}
  score=0;level=1;caught=0;lost=0;combo=0;relT=0;fl=[];parts=[];magnetT=0;freezeT=0;recordBefore=best;
  state='ready';
}
function supply(){return reserve[0].length+reserve[1].length+rets.length+balls.length}
function comboMult(){return 1+Math.min(4,Math.floor(combo/10))}
function levelUp(){
  fl.push({x:180,y:275,t:0,txt:'Level '+level+'!'});AP.sfx.good();setMults();
  for(let i=0;i<4;i++){const s=(Math.random()*2)|0,k=(Math.random()*reserve[s].length)|0;if(reserve[s][k]==='y')reserve[s][k]=rndType(level)}
  for(const b of balls)if(!b.out&&b.t==='y'&&Math.random()<.08)b.t=rndType(level);
}
function update(dt){
  time+=dt;
  for(const c of cups)c.flash=Math.max(0,c.flash-dt);
  if((state==='play'||state==='ready')&&freezeT<=0)cupOff-=Math.min(150,55+8*level)*dt;
  fl.forEach(f=>{f.t+=dt;f.y-=30*dt});fl=fl.filter(f=>f.t<.9);
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});parts=parts.filter(p=>p.t<.5);
  // balls flying back from the cups into the tubs
  if(state!=='paused'){
    for(const r of rets){r.t+=dt/.7;const q=Math.min(1,r.t);r.x=r.sx+(r.tx-r.sx)*q;r.y=r.sy+(r.ty-r.sy)*q-Math.sin(q*Math.PI)*45}
    rets=rets.filter(r=>{if(r.t>=1){if(reserve[r.s].length<30)reserve[r.s].push(r.type);else reserve[1-r.s].push(r.type);return false}return true});
  }
  shake=Math.max(0,shake-dt*30);
  if(state!=='play')return;
  freezeT=Math.max(0,freezeT-dt);
  // refill the funnel from the side tubs
  relT-=dt;
  let inF=0;for(const b of balls)if(!b.out)inF++;
  if(relT<=0&&inF<44&&reserve[0].length+reserve[1].length>0){
    relT=.05;let s=relN++%2;if(!reserve[s].length)s=1-s;
    const t=reserve[s].pop(),k=reserve[s].length;
    balls.push(mk((s?284.5:17.3)+(k%5)*14.6,7+Math.floor(k/5)*14.5,t));
  }
  gateOpen=down||gateT>0;gateT=Math.max(0,gateT-dt);
  // magnet power: gently pulls falling balls toward the nearest cup
  if(magnetT>0){
    magnetT-=dt;
    for(const b of balls){
      if(!b.out||b.y>cupY+24)continue;let bx=null,bd=1e9;
      for(let i=0;i<cups.length;i++){const cx=cupX(i),d=Math.abs(cx-b.x);if(d<bd){bd=d;bx=cx}}
      if(bx!==null&&bd<110)b.x+=Math.max(-.3,Math.min(.3,(bx-b.x)*.012));
    }
  }
  acc+=dt;let n=0;while(acc>=DT&&n<6){step();acc-=DT;n++}if(acc>DT)acc=0;
  // power-up balls trigger as they leave the gate; catches and misses
  for(const b of balls){
    if(!b.out)continue;b.age+=dt;
    if(!b.fx){
      b.fx=1;
      if(b.t==='m'){magnetT=4;fl.push({x:180,y:GATE+20,t:0,txt:'🧲 Magnet!'});AP.sfx.good()}
      else if(b.t==='f'){freezeT=3;fl.push({x:180,y:GATE+20,t:0,txt:'❄️ Freeze!'});AP.sfx.good()}
    }
    for(let i=0;i<cups.length;i++){
      const cx=cupX(i),yy=b.y-cupY;
      if(yy>26&&yy<82){
        const l=cx-31+11*(yy/82),r=cx+31-11*(yy/82);
        if(b.x>l+3&&b.x<r-3&&b.y-b.py>0){catchBall(b,i,cx);break}
      }
    }
    if(!b.dead&&(b.y>H+20||b.x<-20||b.x>W+20||b.age>9)){b.dead=true;lost++;combo=0;shake=Math.max(shake,3)}
  }
  balls=balls.filter(b=>!b.dead);
  const nl=1+Math.floor(caught/25);
  if(nl>level){level=nl;levelUp()}
  if(supply()===0)gameOver();
}
function catchBall(b,i,cx){
  b.dead=true;caught++;combo++;
  const c=cups[i],pts=c.mult*comboMult();score+=pts;c.flash=.25;
  fl.push({x:cx,y:cupY-14,t:0,txt:'+'+pts});
  for(let k=0;k<4;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*140,vy:-Math.random()*120,t:0,c:COL[b.t]});
  AP.tone(520+Math.min(combo,24)*22,.07,'sine',.09);AP.vib(8);
  // the ball comes back from the top: it reappears in a tub and falls into the funnel again
  const s=reserve[0].length<=reserve[1].length?0:1,k=reserve[s].length;
  reserve[s].push(b.t);
  const tx=(s?284.5:17.3)+(k%5)*14.6,ty=7+Math.floor(k/5)*14.5;
  for(let q=0;q<3;q++)parts.push({x:tx,y:ty,vx:(Math.random()-.5)*60,vy:Math.random()*40,t:0,c:'#fff'});
  if(score>best){best=score;LS.s('bd_best',best)}
}
function gameOver(){
  if(state!=='play')return;state='over';gateOpen=false;down=false;
  const rec=score>recordBefore;
  setTimeout(()=>{
    $('oT').textContent=rec?'🏆 New record!':'All 100 balls lost!';
    $('oM').textContent='Score '+score.toLocaleString('en-US')+' · Record '+best.toLocaleString('en-US')+' · '+caught+' balls caught';
    $('over').classList.add('show');
    if(rec){AP.sfx.win();AP.confetti(140);AP.vib([40,30,80])}else AP.sfx.lose();
  },700);
}

/* ---------- drawing ---------- */
function ball(x,y,t){
  ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fillStyle=COL[t];ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=INK;ctx.stroke();
  if(GLY[t]){ctx.font='10px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=INK;ctx.fillText(GLY[t],x,y+.5);ctx.textBaseline='alphabetic'}
  else{ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(x-2,y-2,1.9,0,TAU);ctx.fill()}
}
function txt(s,x,y,size,fill,stroke,sw){
  ctx.font='900 '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(stroke){ctx.lineWidth=sw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function cupPath(cx){ctx.beginPath();ctx.moveTo(cx-31,cupY);ctx.lineTo(cx+31,cupY);ctx.lineTo(cx+20,cupY+82);ctx.lineTo(cx-20,cupY+82);ctx.closePath()}
function draw(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffe6d6');g.addColorStop(1,'#ffa987');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.lineJoin='round';ctx.lineCap='round';
  // funnel
  ctx.beginPath();ctx.moveTo(7,-4);ctx.lineTo(7,127);ctx.lineTo(163,193);ctx.lineTo(163,GATE);ctx.lineTo(197,GATE);ctx.lineTo(197,193);ctx.lineTo(353,127);ctx.lineTo(353,-4);
  ctx.fillStyle='rgba(255,255,255,.62)';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=4.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(85,-4);ctx.lineTo(85,95);ctx.moveTo(275,-4);ctx.lineTo(275,95);ctx.stroke();
  if(!gateOpen){ctx.strokeStyle=INK;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(165,GATE);ctx.lineTo(195,GATE);ctx.stroke();ctx.strokeStyle='#ff5d6c';ctx.lineWidth=4;ctx.stroke()}
  // reserve balls in the tubs
  for(let s=0;s<2;s++)reserve[s].forEach((t,k)=>ball((s?284.5:17.3)+(k%5)*14.6,7+Math.floor(k/5)*14.5,t));
  for(const b of balls)ball(b.x,b.y,b.t);
  for(const r of rets)ball(r.x,r.y,r.type);
  // cups with their counts
  for(let i=0;i<cups.length;i++){
    const c=cups[i],cx=cupX(i),frac=0;
    cupPath(cx);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fill();
    if(c.mult>1){cupPath(cx);ctx.fillStyle=c.mult===2?'rgba(126,217,87,.7)':'rgba(255,157,77,.7)';ctx.fill()}
    if(frac>0){
      const hh=82*frac,y0=cupY+82-hh,e=11*((y0-cupY)/82);
      ctx.beginPath();ctx.moveTo(cx-31+e,y0);ctx.lineTo(cx+31-e,y0);ctx.lineTo(cx+20,cupY+82);ctx.lineTo(cx-20,cupY+82);ctx.closePath();
      ctx.fillStyle=c.done?'#7ed957':CUPCOL[i%3];ctx.fill();
    }
    if(c.flash>0){cupPath(cx);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fill()}
    cupPath(cx);ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cupY+52,16,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.stroke();
    txt(c.mult+'X',cx,cupY+58,15,INK);
    
    if(freezeT>0)txt('❄️',cx,cupY-24,15,INK);
  }
  // roof
  ctx.beginPath();ctx.moveTo(-60,roofY+60);ctx.lineTo(180,roofY);ctx.lineTo(420,roofY+60);ctx.lineWidth=4.5;ctx.strokeStyle=INK;ctx.stroke();
  for(const p of parts){ctx.globalAlpha=1-p.t/.5;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,TAU);ctx.fill()}
  ctx.globalAlpha=1;
  for(const f of fl){ctx.globalAlpha=1-f.t/.9;txt(f.txt,f.x,f.y,16,'#fff',INK,4)}
  ctx.globalAlpha=1;ctx.restore();
  // HUD: combo, remaining balls, score
  const cm=comboMult();
  ctx.beginPath();ctx.arc(180,-2,26,0,Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
  txt('X'+cm,180,17,15,INK);
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(120,28,120,16,8);else ctx.rect(120,28,120,16);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
  const fr=cm>=5?1:(combo%10)/10;
  if(fr>0){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(122,30,116*fr,12,6);else ctx.rect(122,30,116*fr,12);ctx.fillStyle='#ff9d4d';ctx.fill()}
  ctx.beginPath();ctx.moveTo(119,76);ctx.lineTo(180,54);ctx.lineTo(241,76);ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
  txt(String(supply()),180,78,22,INK);txt('balls left',180,96,11,INK,'#fff',3);
  if(magnetT>0)txt('🧲 '+Math.ceil(magnetT)+'s',140,116,14,INK,'#fff',4);
  if(freezeT>0)txt('❄️ '+Math.ceil(freezeT)+'s',222,116,14,INK,'#fff',4);
  txt(score.toLocaleString('en-US'),180,304,54,INK,'#fff',9);
  txt('Level '+level,180,336,20,INK,'#fff',5);
  txt('Record '+best.toLocaleString('en-US')+' · Lost '+lost+'/100',180,358,14,score>0&&score>=best?'#1f8f4a':INK,'#fff',4);
  for(const bt of [[33,185,0],[327,185,1]]){
    ctx.beginPath();ctx.arc(bt[0],bt[1],20,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.stroke();
    if(bt[2]===0){ctx.fillStyle=INK;ctx.fillRect(26,177,5,16);ctx.fillRect(36,177,5,16)}else txt(AP.muted()?'🔇':'🔊',bt[0],bt[1]+6,17,INK);
  }
  if(state==='ready'){
    txt('Tap to release the balls',180,H*.74,22,INK,'#fff',6);
    txt('Drop them into the cups',180,H*.74+28,18,INK,'#fff',5);
    ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('👆',180,H*.86+Math.abs(Math.sin(time*4))*10);
  }
}

/* ---------- input ---------- */
let down=false,lastX=0,gateT=0;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=pos(e);
  if(Math.hypot(p.x-33,p.y-185)<28){if(state==='play'||state==='ready')pause();return}
  if(Math.hypot(p.x-327,p.y-185)<28){AP.setMuted(!AP.muted());return}
  if(state==='ready')state='play';
  if(state!=='play')return;
  down=true;gateOpen=true;gateT=.12;lastX=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(x){}
});
const up=()=>{down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(state==='ready')state='play';if(state==='play'){down=true;gateT=.12}}
});
window.addEventListener('keyup',e=>{if(e.code==='Space')down=false});
function pause(){if(state!=='play'&&state!=='ready')return;gateOpen=false;down=false;$('pause').dataset.prev=state;state='paused';$('pause').classList.add('show')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- buttons ---------- */
function hideAll(){['start','pause','over'].forEach(i=>$(i).classList.remove('show'))}
function newGame(){hideAll();startGame()}
$('go').addEventListener('click',newGame);
$('resume').addEventListener('click',()=>{$('pause').classList.remove('show');state=$('pause').dataset.prev||'play'});
$('redo').addEventListener('click',newGame);
$('again').addEventListener('click',newGame);

let last=performance.now();
function loop(t){const dt=Math.min((t-last)/1000,1/20);last=t;update(dt);draw();requestAnimationFrame(loop)}
resize();layout();startGame();state='menu';AP.autoTap();
requestAnimationFrame(loop);
})();
</script>
<script src="pwa.js"></script>
</body>
</html>
